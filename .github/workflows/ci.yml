# push と pull request のたびに、ビルド(警告をエラー扱い)・単体テスト・禁止 API の検索を流す。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build PadSight.slnx -c Release -warnaserror
      - name: Test
        run: dotnet test tests/PadSight.Tests/PadSight.Tests.csproj -c Release --no-build
      - name: Banned API check
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/check.ps1
